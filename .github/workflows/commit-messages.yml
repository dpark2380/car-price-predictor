name: Commit messages
on: [push, pull_request]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      - name: Run the commit-msg hook over every commit on this ref
        run: |
          fail=0
          for c in $(git rev-list HEAD); do
            git log -1 --format=%B "$c" > before.txt
            cp before.txt after.txt
            if ! sh .githooks/commit-msg after.txt || ! cmp -s before.txt after.txt; then
              echo "::error::commit $c breaks the commit message rule in AGENTS.md"
              fail=1
            fi
          done
          exit $fail
